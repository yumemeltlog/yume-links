<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆめ🍒 リンク集</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #FF6B9D;
      --pink2: #FF3D8A;
      --cherry: #C0003C;
      --dark: #0F0008;
      --dark2: #1E0015;
      --card: rgba(255,107,157,0.08);
      --text: #FFE0ED;
      --text-mid: rgba(255,224,237,0.6);
      --grad: linear-gradient(135deg, #FF6B9D, #C0003C);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Noto Sans JP', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 64px;
      position: relative;
      overflow-x: hidden;
    }

    /* BG */
    body::before {
      content:'';
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,107,157,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(192,0,60,0.12) 0%, transparent 70%);
    }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
    }

    /* AVATAR */
    .avatar-wrap {
      width: 100px; height: 100px;
      border-radius: 50%; overflow: hidden;
      border: 3px solid var(--pink);
      box-shadow: 0 0 0 5px rgba(255,107,157,0.15), 0 8px 32px rgba(255,107,157,0.3);
      margin-bottom: 16px;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
    }
    .avatar-wrap img {
      width:100%; height:100%; object-fit:cover;
    }

    /* NAME */
    .name {
      font-family:'Fredoka One', cursive;
      font-size: 28px;
      background: var(--grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 12px; color: var(--text-mid);
      text-align: center; line-height: 1.8;
      margin-bottom: 8px; letter-spacing: 0.5px;
    }

    /* SNS ROW */
    .sns-row {
      display: flex; gap: 12px; margin-bottom: 32px;
    }
    .sns-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,107,157,0.1);
      border: 1px solid rgba(255,107,157,0.25);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 12px; font-weight: 700;
      color: var(--pink); text-decoration: none;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }
    .sns-btn:hover {
      background: rgba(255,107,157,0.2);
      border-color: var(--pink);
    }

    /* LINKS */
    .links {
      width: 100%;
      display: flex; flex-direction: column; gap: 12px;
    }

    .link-btn {
      display: flex; align-items: center;
      width: 100%;
      background: var(--card);
      border: 1.5px solid rgba(255,107,157,0.2);
      border-radius: 18px;
      padding: 18px 22px;
      text-decoration: none; color: var(--text);
      transition: all 0.18s;
      position: relative; overflow: hidden;
      gap: 16px;
    }
    .link-btn::before {
      content:'';
      position:absolute; inset:0;
      background: var(--grad);
      opacity:0; transition:opacity 0.18s;
    }
    .link-btn:hover {
      border-color: var(--pink);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,107,157,0.2);
    }
    .link-btn:hover::before { opacity:0.06; }
    .link-btn:active { transform: translateY(0); }

    .link-icon {
      font-size: 26px; flex-shrink: 0;
      position: relative; z-index:1;
    }
    .link-info {
      flex: 1; position: relative; z-index:1;
    }
    .link-title {
      font-family:'Fredoka One', cursive;
      font-size: 16px; line-height: 1.3;
      margin-bottom: 3px;
    }
    .link-desc {
      font-size: 11px; color: var(--text-mid); line-height: 1.5;
    }
    .link-badge {
      flex-shrink: 0;
      background: var(--grad);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 11px; letter-spacing: 1px;
      padding: 5px 12px; border-radius: 999px;
      position: relative; z-index:1;
    }
    .link-badge.free {
      background: rgba(255,107,157,0.15);
      color: var(--pink);
      border: 1px solid rgba(255,107,157,0.3);
    }

    /* FEATURED */
    .link-btn.featured {
      border-color: rgba(255,107,157,0.5);
      background: rgba(255,107,157,0.1);
      box-shadow: 0 0 24px rgba(255,107,157,0.1);
    }

    /* DIVIDER */
    .divider {
      width: 100%; text-align: center;
      font-size: 11px; color: var(--text-mid);
      letter-spacing: 2px; text-transform: uppercase;
      margin: 8px 0 4px;
      display: flex; align-items: center; gap: 12px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px;
      background: rgba(255,107,157,0.15);
    }

    /* FOOTER */
    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px; color: var(--text-mid);
      line-height: 2;
    }
    .footer-brand {
      font-family:'Fredoka One', cursive;
      font-size: 16px;
      background: var(--grad);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom: 4px;
    }

    /* FLOATING STARS */
    .star {
      position: fixed; font-size: 14px; pointer-events: none;
      animation: starFloat linear infinite; opacity: 0;
    }
    @keyframes starFloat {
      0%   { opacity:0; transform:translateY(20px) rotate(0deg); }
      15%  { opacity:0.6; }
      85%  { opacity:0.4; }
      100% { opacity:0; transform:translateY(-120px) rotate(720deg); }
    }
  </style>
</head>

  <script>
    const icons = ['🍒','✨','💕','⭐','🌸','💫'];
    for(let i = 0; i < 15; i++) {

</html>
